<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chocolate Swirl Buns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE9DA;
    --card:#FFFDF8;
    --ink:#2B2620;
    --ink-soft:#6B6355;
    --sage:#4A5D3A;
    --mustard:#C17817;
    --rule:#C9BFA6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(43,38,32,0.05) 1px, transparent 0);
    background-size:18px 18px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:40px 20px 80px;
  }
  .sheet{
    max-width:880px;
    margin:0 auto;
    background:var(--card);
    border-radius:4px;
    box-shadow:0 1px 2px rgba(43,38,32,0.08), 0 12px 32px rgba(43,38,32,0.10);
    overflow:hidden;
  }
  .tab{
    display:inline-block;
    background:var(--sage);
    color:var(--card);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    padding:6px 16px;
    border-radius:0 0 6px 0;
  }
  header{ padding:28px 40px 20px; border-bottom:1px solid var(--rule); }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(28px,4vw,42px);
    margin:14px 0 8px;
    line-height:1.05;
  }
  .meta{ color:var(--ink-soft); font-size:14px; display:flex; gap:18px; flex-wrap:wrap; margin-top:6px;}
  .meta span{ display:inline-flex; align-items:center; gap:6px; }
  .source{ font-size:12.5px; color:var(--ink-soft); margin-top:10px; }
  .source a{ color:var(--sage); }

  .body-grid{ display:grid; grid-template-columns:270px 1fr; }
  @media (max-width:640px){ .body-grid{ grid-template-columns:1fr; } }

  .ingredients-col{ border-right:1px solid var(--rule); padding:24px 28px; }
  @media (max-width:640px){ .ingredients-col{ border-right:none; border-bottom:1px solid var(--rule);} }

  .servings-dial{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--paper); border-radius:999px; padding:6px 6px 6px 16px;
    margin-bottom:20px;
  }
  .servings-dial .label{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; }
  .servings-dial .controls{ display:flex; align-items:center; gap:2px; }
  .servings-dial button{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--rule);
    background:var(--card); color:var(--ink); font-size:15px; cursor:pointer; line-height:1;
  }
  .servings-dial button:hover{ background:var(--mustard); color:#fff; border-color:var(--mustard); }
  #servings-count{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:16px;
    width:34px; text-align:center; display:inline-block;
  }

  h2.section-title{
    font-family:'Fraunces',serif; font-size:14px; text-transform:uppercase;
    letter-spacing:.1em; color:var(--sage); margin:0 0 12px;
  }
  ul.ingredients{ list-style:none; margin:0; padding:0; }
  ul.ingredients li{
    display:flex; gap:10px; padding:7px 0; border-bottom:1px dashed var(--rule);
    font-size:14.5px; align-items:baseline;
  }
  ul.ingredients li:last-child{ border-bottom:none; }
  .amt{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--mustard); min-width:64px; }

  .steps-col{ padding:24px 32px 32px; }
  ol.steps{ list-style:none; margin:0; padding:0; counter-reset:step; }
  ol.steps li{
    counter-increment:step; position:relative; padding:0 0 20px 40px; font-size:15px; line-height:1.6;
  }
  ol.steps li::before{
    content:counter(step);
    position:absolute; left:0; top:0;
    width:26px; height:26px; border-radius:50%;
    background:var(--sage); color:#fff;
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
  }
  ol.steps li .inline-amt{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--mustard); }

  .notes{ margin-top:8px; padding:16px 32px 28px; border-top:1px solid var(--rule); font-size:13.5px; color:var(--ink-soft); }

  @media print{
    body{ background:#fff; padding:0; }
    .sheet{ box-shadow:none; border-radius:0; }
    .servings-dial button{ display:none; }
    .tab{ background:none; color:var(--ink); }
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="tab">BAKING · BREAKFAST</div>
  <header>
    <h1>Chocolate Swirl Buns</h1>
    <div class="meta">
      <span>⏱ 1 hr 45 min rise</span>
      <span>🔥 20 min bake</span>
      <span>🍽 <span id="servings-label"></span> servings</span>
    </div>
    <div class="source">Heavily downsized and streamlined from Martha Stewart's chocolate babka</div>
  </header>

  <div class="body-grid">
    <div class="ingredients-col">
      <div class="servings-dial">
        <span class="label">Servings</span>
        <div class="controls">
          <button id="dec">–</button>
          <span id="servings-count"></span>
          <button id="inc">+</button>
        </div>
      </div>
      <h2 class="section-title">Ingredients</h2>
      <ul class="ingredients" id="ingredients-list"></ul>
    </div>
    <div class="steps-col">
      <h2 class="section-title">Method</h2>
      <ol class="steps" id="steps-list"></ol>
    </div>
  </div>
  <div class="notes" id="notes-block" style="display:none;"></div>
</div>

<script id="recipe-data" type="application/json">
{
  "baseServings": 12,
  "ingredients": [
    {
      "id": "milk",
      "name": "milk, preferably whole",
      "baseAmount": 120,
      "unit": "ml",
      "category": "volume"
    },
    {
      "id": "doughsugar",
      "name": "granulated sugar, for the dough, plus a pinch for the yeast",
      "baseAmount": 50,
      "unit": "g",
      "category": "weight"
    },
    {
      "id": "yeast",
      "name": "active dry yeast",
      "baseAmount": 1.5,
      "unit": "tsp",
      "category": "small"
    },
    {
      "id": "egg",
      "name": "large egg, at room temperature",
      "baseAmount": 1,
      "unit": "",
      "category": "count"
    },
    {
      "id": "flour",
      "name": "all-purpose flour, plus more for the work surface",
      "baseAmount": 250,
      "unit": "g",
      "category": "weight"
    },
    {
      "id": "salt",
      "name": "table salt",
      "baseAmount": 0.5,
      "unit": "tsp",
      "category": "small"
    },
    {
      "id": "doughbutter",
      "name": "unsalted butter, at room temperature, for the dough, plus more for the bowl and tin",
      "baseAmount": 45,
      "unit": "g",
      "category": "weight"
    },
    {
      "id": "fillingbutter",
      "name": "unsalted butter, at room temperature, for the filling",
      "baseAmount": 45,
      "unit": "g",
      "category": "weight"
    },
    {
      "id": "fillingsugar",
      "name": "granulated sugar, for the filling",
      "baseAmount": 50,
      "unit": "g",
      "category": "weight"
    },
    {
      "id": "chocolate",
      "name": "semisweet chocolate",
      "baseAmount": 225,
      "unit": "g",
      "category": "weight"
    },
    {
      "id": "fillingsalt",
      "name": "salt, for the filling",
      "baseAmount": 0.125,
      "unit": "tsp",
      "category": "small"
    },
    {
      "id": "cinnamon",
      "name": "ground cinnamon (optional)",
      "baseAmount": 0.75,
      "unit": "tsp",
      "category": "small"
    },
    {
      "id": "washegg",
      "name": "egg, for the wash (optional)",
      "baseAmount": 1,
      "unit": "",
      "category": "count"
    },
    {
      "id": "washcream",
      "name": "heavy cream or milk, for the wash",
      "baseAmount": 2,
      "unit": "tsp",
      "category": "small"
    }
  ],
  "steps": [
    "Warm the {{milk}} with a pinch of the {{doughsugar}} to 43–47°C (110–116°F) — warm but not hot to the touch, and err cool. Sprinkle the {{yeast}} over the milk and leave until foamy, about 5 minutes. In a small bowl, whisk the {{egg}} with the remaining dough sugar, then slowly whisk in the yeast mixture.",
    "In a stand mixer with the paddle attachment, combine the {{flour}} and {{salt}}. Run the mixer on low and add the egg mixture, mixing until combined. Add the {{doughbutter}} and mix until incorporated.",
    "Switch to the dough hook and knead on low for 10 minutes. At the end it will be sticky and stringy and probably worrying, but it firms up after rising. Put the dough in a buttered bowl, cover loosely with a lint-free towel or plastic wrap, and let rise 1 hour, until doubled.",
    "Meanwhile make the filling: roughly chop the {{chocolate}} if it's in bars, then pulse it in a food processor with the {{fillingsalt}}, {{fillingsugar}} and {{cinnamon}} until very finely chopped, some of it almost powdery. Add the {{fillingbutter}} and pulse until distributed throughout. (No processor? Chop the chocolate very fine and stir in the rest by hand.) Set aside.",
    "Generously butter a standard 12-cup muffin tin.",
    "Turn the risen dough onto a well-floured surface and gently deflate it with floured hands. Rest 5 minutes, then roll it into a large rectangle — the short sides a scant 28–30 cm, the long side as long as you can manage. Longer means more dramatic swirls; 50 cm is a good target.",
    "Scatter the filling evenly over the dough. It will look clumpy and like too much chocolate for the dough — do your best. Roll the dough tightly from one short end to the other into a 30–33 cm log.",
    "With a sharp serrated knife, gently saw the log into 2.5 cm segments and set each in a muffin cup. Cover loosely and let rise another 30 minutes. Meanwhile, heat the oven to 180°C (350°F).",
    "If you like, whisk the {{washegg}} with the {{washcream}} until smooth and brush over each bun. Bake 15 to 20 minutes, until puffed and browned — an instant-read thermometer should show 85–88°C in the middle of a bun.",
    "Set the tin on a cooling rack. In theory you should cool them completely before unmolding with the help of a thin knife. In practice, have at them — just don't burn your tongue."
  ],
  "notes": "Yields 12 muffin-sized buns. Make ahead: form the buns, place them in the muffin cups, and refrigerate overnight loosely covered with oiled plastic, then bake straight from the fridge in the morning. They also freeze, baked, for up to a month. The egg wash makes them shinier but otherwise barely changes the colour."
}
</script>

<script>
const data = JSON.parse(document.getElementById('recipe-data').textContent);
let servings = data.baseServings;

// --- unit-aware rounding & fraction display ---
const FRACTIONS = [[0,''],[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],[1/2,'½'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[7/8,'⅞']];
function toFraction(x){
  const whole = Math.floor(x);
  const rem = x - whole;
  let best = FRACTIONS[0], bestDiff = Infinity;
  for(const f of FRACTIONS){ const d = Math.abs(f[0]-rem); if(d<bestDiff){bestDiff=d; best=f;} }
  let out = '';
  if(whole>0) out += whole;
  if(best[1]) out += (whole>0?' ':'') + best[1];
  if(!out) out = '0';
  return out;
}
function roundAmount(amount, unit, category){
  if(category === 'count'){
    const r = Math.max(1, Math.round(amount));
    return String(r);
  }
  if(category === 'small'){ // tsp/tbsp — show as friendly fractions
    return toFraction(amount);
  }
  if(unit === 'g'){
    if(amount < 20) return String(Math.round(amount));
    if(amount < 200) return String(Math.round(amount/5)*5);
    return String(Math.round(amount/10)*10);
  }
  if(unit === 'ml'){
    if(amount < 50) return String(Math.round(amount/5)*5);
    if(amount < 500) return String(Math.round(amount/25)*25);
    return String(Math.round(amount/50)*50);
  }
  // fallback: 1 decimal
  return String(Math.round(amount*10)/10);
}
function scaledAmount(ing){
  const ratio = servings / data.baseServings;
  const raw = ing.baseAmount * ratio;
  return roundAmount(raw, ing.unit, ing.category);
}
function amountText(ing){
  const val = scaledAmount(ing);
  return ing.unit && ing.category !== 'count' ? `${val} ${ing.unit}` : val;
}

function render(){
  document.getElementById('servings-count').textContent = servings;
  document.getElementById('servings-label').textContent = servings;

  const list = document.getElementById('ingredients-list');
  list.innerHTML = '';
  data.ingredients.forEach(ing=>{
    const li = document.createElement('li');
    li.innerHTML = `<span class="amt">${amountText(ing)}</span><span>${ing.name}</span>`;
    list.appendChild(li);
  });

  const steps = document.getElementById('steps-list');
  steps.innerHTML = '';
  data.steps.forEach(stepTemplate=>{
    let text = stepTemplate.replace(/\{\{(\w[\w-]*)\}\}/g, (_, id)=>{
      const ing = data.ingredients.find(i=>i.id === id);
      return ing ? `<span class="inline-amt">${amountText(ing)}</span> ${ing.name}` : '';
    });
    const li = document.createElement('li');
    li.innerHTML = text;
    steps.appendChild(li);
  });

  if(data.notes){
    const notesBlock = document.getElementById('notes-block');
    notesBlock.style.display = 'block';
    notesBlock.innerHTML = `<strong>Notes:</strong> ${data.notes}`;
  }
}

document.getElementById('inc').addEventListener('click', ()=>{ servings++; render(); });
document.getElementById('dec').addEventListener('click', ()=>{ if(servings>1) servings--; render(); });

render();
</script>
</body>
</html>
